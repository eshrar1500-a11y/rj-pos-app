<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RJ Restaurant POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 2px; }
        button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

        /* प्रिंट करते वक्त सिर्फ बिल और टोटल ही दिखाई देगा, बाकी पूरा ऐप छुप जाएगा */
        @media print {
            body * {
                visibility: hidden !important;
            }
            #printableReceipt, #printableReceipt * {
                visibility: visible !important;
            }
            #printableReceipt {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white;
                color: black;
                padding: 10px;
            }
        }
    </style>
</head>
<body class="bg-gray-950 text-white h-screen flex flex-col overflow-hidden text-xs font-sans">
    
    <!-- Top Header -->
    <header class="bg-gray-900 border-b border-gray-800 px-3 py-2 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-2">
            <button type="button" class="text-gray-300 text-base p-1">☰</button>
            <div class="bg-white text-gray-950 font-black px-2 py-0.5 rounded text-sm tracking-wider flex items-center gap-0.5 shadow">
                <span class="text-red-600">R</span>J
            </div>
            <span class="font-bold text-sm text-gray-200">New Order & Billing</span>
        </div>
        <div class="flex items-center gap-3 text-gray-300 text-sm">
            <span>🔔</span>
            <span>⋮</span>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 grid grid-cols-1 md:grid-cols-12 gap-1 p-1.5 overflow-hidden bg-gray-950">
        
        <!-- Left: Categories Sidebar & Item Catalog -->
        <div class="md:col-span-7 grid grid-cols-12 gap-1 bg-gray-900 p-1.5 rounded-lg border border-gray-800 overflow-hidden">
            
            <!-- Category Icons Sidebar -->
            <div class="col-span-3 overflow-y-auto space-y-1 pr-1 border-r border-gray-800 text-center">
                <button type="button" onclick="filterCategory('all')" class="w-full bg-red-600 text-white p-2 rounded-md font-medium flex flex-col items-center gap-0.5 text-[10px] shadow">
                    <span class="text-sm">🍽️</span> All
                </button>
                <button type="button" onclick="filterCategory('Starters')" class="w-full bg-gray-800 text-gray-300 p-1.5 rounded-md hover:bg-gray-700 flex flex-col items-center gap-0.5 text-[10px]">
                    <span>🍗</span> Starters
                </button>
                <button type="button" onclick="filterCategory('Soups')" class="w-full bg-gray-800 text-gray-300 p-1.5 rounded-md hover:bg-gray-700 flex flex-col items-center gap-0.5 text-[10px]">
                    <span>🥣</span> Soups
                </button>
                <button type="button" onclick="filterCategory('Indian Breads')" class="w-full bg-gray-800 text-gray-300 p-1.5 rounded-md hover:bg-gray-700 flex flex-col items-center gap-0.5 text-[10px]">
                    <span>🫓</span> Breads
                </button>
                <button type="button" onclick="filterCategory('Rice & Biryani')" class="w-full bg-gray-800 text-gray-300 p-1.5 rounded-md hover:bg-gray-700 flex flex-col items-center gap-0.5 text-[10px]">
                    <span>🍚</span> Biryani
                </button>
                <button type="button" onclick="filterCategory('Pizza')" class="w-full bg-gray-800 text-gray-300 p-1.5 rounded-md hover:bg-gray-700 flex flex-col items-center gap-0.5 text-[10px]">
                    <span>🍕</span> Pizza
                </button>
                <button type="button" onclick="filterCategory('South Indian')" class="w-full bg-gray-800 text-gray-300 p-1.5 rounded-md hover:bg-gray-700 flex flex-col items-center gap-0.5 text-[10px]">
                    <span>🥘</span> South Indian
                </button>
                <button type="button" onclick="filterCategory('Ice Cream')" class="w-full bg-gray-800 text-gray-300 p-1.5 rounded-md hover:bg-gray-700 flex flex-col items-center gap-0.5 text-[10px]">
                    <span>🍨</span> Ice Cream
                </button>
                <button type="button" onclick="filterCategory('Beverages')" class="w-full bg-gray-800 text-gray-300 p-1.5 rounded-md hover:bg-gray-700 flex flex-col items-center gap-0.5 text-[10px]">
                    <span>🥤</span> Beverages
                </button>
                <button type="button" onclick="filterCategory('Desserts')" class="w-full bg-gray-800 text-gray-300 p-1.5 rounded-md hover:bg-gray-700 flex flex-col items-center gap-0.5 text-[10px]">
                    <span>🍰</span> Desserts
                </button>
                <button type="button" onclick="filterCategory('Combo')" class="w-full bg-gray-800 text-gray-300 p-1.5 rounded-md hover:bg-gray-700 flex flex-col items-center gap-0.5 text-[10px]">
                    <span>👑</span> Combo
                </button>
                <button type="button" onclick="filterCategory('Others')" class="w-full bg-gray-800 text-gray-300 p-1.5 rounded-md hover:bg-gray-700 flex flex-col items-center gap-0.5 text-[10px]">
                    <span>⋯</span> Others
                </button>
            </div>

            <!-- Items List Section -->
            <div class="col-span-9 flex flex-col gap-2 overflow-hidden pl-1">
                <input type="text" id="searchBox" onkeyup="handleSearch()" placeholder="🔍 Search item..." class="bg-gray-800 border border-gray-700 px-2.5 py-1.5 rounded-md text-white outline-none focus:border-red-500 text-xs">
                
                <div class="flex gap-1 overflow-x-auto pb-1 shrink-0 text-[10px]">
                    <button type="button" onclick="filterTag('all')" class="bg-red-600 px-2.5 py-0.5 rounded-full whitespace-nowrap font-medium">All</button>
                    <button type="button" onclick="filterTag('Veg')" class="bg-gray-800 text-gray-300 px-2.5 py-0.5 rounded-full whitespace-nowrap">Veg</button>
                    <button type="button" onclick="filterTag('Non-Veg')" class="bg-gray-800 text-gray-300 px-2.5 py-0.5 rounded-full whitespace-nowrap">Non-Veg</button>
                    <button type="button" onclick="filterTag('Beverages')" class="bg-gray-800 text-gray-300 px-2.5 py-0.5 rounded-full whitespace-nowrap">Beverages</button>
                </div>

                <div id="itemList" class="flex-1 overflow-y-auto space-y-1.5 pr-1"></div>
            </div>
        </div>

        <!-- Right: Billing & Order Panel -->
        <div class="md:col-span-5 bg-gray-900 p-2 rounded-lg border border-gray-800 flex flex-col justify-between overflow-hidden relative">
            
            <!-- Toast Notification Box -->
            <div id="toast" class="absolute top-2 left-1/2 -translate-x-1/2 bg-emerald-600 text-white px-3 py-1 rounded shadow-lg text-[11px] font-bold opacity-0 transition-opacity duration-300 pointer-events-none z-50"></div>

            <div>
                <!-- Top Tabs -->
                <div class="grid grid-cols-2 bg-gray-800 rounded-md p-0.5 mb-2 font-bold text-center text-xs">
                    <div class="bg-red-600 text-white py-1 rounded">New Order</div>
                    <div class="text-gray-400 py-1">Billing</div>
                </div>

                <!-- Table & Persons Info Bar -->
                <div class="grid grid-cols-2 bg-gray-800/80 border border-gray-700 rounded-md p-1.5 mb-2 text-center">
                    <div class="border-r border-gray-700">
                        <span class="text-[9px] text-gray-400 block">Table No.</span>
                        <span class="font-black text-sm text-amber-400">🚪 T3</span>
                    </div>
                    <div>
                        <span class="text-[9px] text-gray-400 block">Persons</span>
                        <span class="font-black text-sm text-amber-400">👥 2</span>
                    </div>
                </div>

                <!-- Printable Receipt Area (Only items & totals will print) -->
                <div id="printableReceipt">
                    <div class="text-center font-bold text-sm mb-1 hidden print:block text-black">RJ RESTAURANT - BILL</div>
                    <!-- Order Items Header -->
                    <div class="flex justify-between text-[10px] font-bold text-gray-400 print:text-black border-b border-gray-800 print:border-gray-400 pb-1 px-1 mb-1">
                        <span>Item Name</span>
                        <div class="flex gap-4">
                            <span>Qty</span>
                            <span>Price</span>
                            <span>Total</span>
                        </div>
                    </div>
                    
                    <div id="orderList" class="space-y-1.5 max-h-32 overflow-y-auto pr-1">
                        <p class="text-gray-500 text-center py-4">No items added yet.</p>
                    </div>
                </div>

                <!-- Note / Special Instruction -->
                <input type="text" placeholder="Note / Special Instruction (Optional)..." class="w-full bg-gray-800 border border-gray-700 rounded px-2 py-1 text-[10px] text-gray-300 mt-2 outline-none print:hidden">
            </div>

            <!-- Calculation & Action Buttons -->
            <div class="border-t border-gray-800 pt-2 space-y-1.5 shrink-0 pb-8 print:hidden">
                <div class="flex justify-between text-gray-400 text-xs">
                    <span>Sub Total</span>
                    <span id="subTotal" class="text-white font-semibold">₹0</span>
                </div>
                <div class="flex justify-between text-gray-400 text-xs items-center">
                    <span>Discount (%)</span>
                    <input type="number" id="discountInput" value="0" oninput="updateOrderUI()" class="w-14 bg-gray-800 border border-gray-700 px-1 py-0.5 rounded text-right text-white outline-none">
                </div>
                <div class="flex justify-between text-gray-400 text-xs">
                    <span>Tax (GST 5%)</span>
                    <span id="taxAmount" class="text-white font-semibold">₹0</span>
                </div>
                <div class="flex justify-between font-black text-sm bg-gray-800 px-2.5 py-1 rounded border border-gray-700">
                    <span>Total</span>
                    <span id="grandTotal" class="text-amber-400 text-base">₹0</span>
                </div>

                <!-- Payment Method Buttons -->
                <div class="grid grid-cols-3 gap-1 pt-1">
                    <button type="button" onclick="setPaymentMode('Cash')" id="pay-Cash" class="bg-emerald-600 text-white py-1.5 rounded font-bold border border-emerald-500 text-center text-xs">💵 Cash</button>
                    <button type="button" onclick="setPaymentMode('Card')" id="pay-Card" class="bg-gray-800 text-gray-300 py-1.5 rounded font-bold border border-gray-700 text-center text-xs">💳 Card</button>
                    <button type="button" onclick="setPaymentMode('Due')" id="pay-Due" class="bg-gray-800 text-gray-300 py-1.5 rounded font-bold border border-gray-700 text-center text-xs">👤 Due</button>
                </div>

                <!-- Bottom Action Buttons -->
                <div class="grid grid-cols-3 gap-1 pt-1">
                    <button type="button" onclick="saveOrder()" class="bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded font-bold shadow text-sm">SAVE</button>
                    <button type="button" onclick="window.print()" class="bg-blue-600 hover:bg-blue-500 text-white py-3 rounded font-bold shadow text-sm">PRINT</button>
                    <button type="button" onclick="clearOrder()" class="bg-amber-600 hover:bg-amber-500 text-white py-3 rounded font-bold shadow text-sm">KOT</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <footer class="bg-gray-900 border-t border-gray-800 grid grid-cols-4 text-center py-1.5 shrink-0 text-[10px] font-medium print:hidden">
        <button type="button" class="text-red-500 flex flex-col items-center gap-0.5 p-1"><span>🛒</span> New Order</button>
        <button type="button" class="text-gray-400 flex flex-col items-center gap-0.5 p-1"><span>🪑</span> Running Tables</button>
        <button type="button" class="text-gray-400 flex flex-col items-center gap-0.5 p-1"><span>📊</span> Reports</button>
        <button type="button" class="text-gray-400 flex flex-col items-center gap-0.5 p-1"><span>⚙️</span> Settings</button>
    </footer>

    <script>
        // Firebase Setup
        const firebaseConfig = {
            apiKey: "AIzaSyDM06RpXjspQnYx5uD_JKwnkQDvffJMRy4",
            databaseURL: "https://rj-billing-app-default-rtdb.firebaseio.com/",
            projectId: "rj-billing-app",
            storageBucket: "rj-billing-app.firebasestorage.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const ordersRef = db.ref('orders/table_T3');

        const menuItems = [
            { name: "Margherita Pizza", price: 180, category: "Pizza", tag: "Veg" },
            { name: "Veg Burger", price: 120, category: "Pizza", tag: "Veg" },
            { name: "Cold Coffee", price: 80, category: "Beverages", tag: "Beverages" },
            { name: "French Fries", price: 60, category: "Starters", tag: "Veg" },
            { name: "Paneer Pizza", price: 200, category: "Pizza", tag: "Veg" },
            { name: "Chicken Biryani", price: 160, category: "Rice & Biryani", tag: "Non-Veg" },
            { name: "Veg Pasta", price: 140, category: "Others", tag: "Veg" },
            { name: "Chicken Roll", price: 100, category: "Starters", tag: "Non-Veg" },
            { name: "Masala Dosa", price: 90, category: "South Indian", tag: "Veg" },
            { name: "Ice Cream", price: 70, category: "Ice Cream", tag: "Veg" },
            { name: "Tomato Soup", price: 60, category: "Soups", tag: "Veg" },
            { name: "Veg Sandwich", price: 80, category: "Others", tag: "Veg" },
            { name: "Chocolate Shake", price: 90, category: "Beverages", tag: "Beverages" },
            { name: "Mango Shake", price: 80, category: "Beverages", tag: "Beverages" },
            { name: "Oreo Shake", price: 100, category: "Beverages", tag: "Beverages" },
            { name: "Hot Coffee", price: 60, category: "Beverages", tag: "Beverages" }
        ];

        let currentOrder = [];
        let selectedPayment = "Cash";

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.className = `absolute top-2 left-1/2 -translate-x-1/2 px-3 py-1 rounded shadow-lg text-[11px] font-bold z-50 transition-opacity duration-300 ${isError ? 'bg-red-600 text-white' : 'bg-emerald-600 text-white'}`;
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2000);
        }

        function renderItems(items) {
            const list = document.getElementById('itemList');
            if(items.length === 0) {
                list.innerHTML = '<p class="text-gray-500 text-center py-4">No items found.</p>';
                return;
            }
            list.innerHTML = items.map(i => `
                <div class="flex justify-between items-center bg-gray-800/70 p-2 rounded border border-gray-800">
                    <div>
                        <p class="font-semibold text-white">${i.name}</p>
                        <p class="text-amber-400 font-bold">₹${i.price}</p>
                    </div>
                    <button type="button" onclick="addItem('${i.name}', ${i.price})" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded font-bold text-xs">ADD</button>
                </div>
            `).join('');
        }

        function filterCategory(cat) {
            if(cat === 'all') renderItems(menuItems);
            else renderItems(menuItems.filter(i => i.category === cat));
        }

        function filterTag(tag) {
            if(tag === 'all') renderItems(menuItems);
            else renderItems(menuItems.filter(i => i.tag === tag));
        }

        function handleSearch() {
            let q = document.getElementById('searchBox').value.toLowerCase();
            renderItems(menuItems.filter(i => i.name.toLowerCase().includes(q)));
        }

        function addItem(name, price) {
            let item = currentOrder.find(i => i.name === name);
            if(item) item.qty += 1;
            else currentOrder.push({name, price, qty: 1});
            updateOrderUI();
        }

        function changeQty(index, delta) {
            currentOrder[index].qty += delta;
            if(currentOrder[index].qty <= 0) currentOrder.splice(index, 1);
            updateOrderUI();
        }

        function removeItem(index) {
            currentOrder.splice(index, 1);
            updateOrderUI();
        }

        function setPaymentMode(mode) {
            selectedPayment = mode;
            ['Cash', 'Card', 'Due'].forEach(m => {
                let btn = document.getElementById('pay-' + m);
                if(m === mode) {
                    btn.className = "bg-emerald-600 text-white py-1.5 rounded font-bold border border-emerald-500 text-center text-xs";
                } else {
                    btn.className = "bg-gray-800 text-gray-300 py-1.5 rounded font-bold border border-gray-700 text-center text-xs";
                }
            });
        }

        function updateOrderUI() {
            const list = document.getElementById('orderList');
            if(currentOrder.length === 0) {
                list.innerHTML = '<p class="text-gray-500 text-center py-4">No items added yet.</p>';
                subTotal.innerText = '₹0'; taxAmount.innerText = '₹0'; grandTotal.innerText = '₹0';
                return;
            }
            let sub = 0;
            list.innerHTML = currentOrder.map((item, idx) => {
                let total = item.price * item.qty;
                sub += total;
                return `
                    <div class="flex justify-between items-center bg-gray-800 print:bg-white p-1.5 rounded text-xs">
                        <div class="flex items-center gap-1">
                            <button type="button" onclick="removeItem(${idx})" class="text-red-400 font-bold px-1.5 print:hidden">✕</button>
                            <span class="text-gray-200 print:text-black truncate w-24">${item.name}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="flex items-center bg-gray-700 print:hidden rounded px-1">
                                <button type="button" onclick="changeQty(${idx}, -1)" class="text-red-300 font-bold px-1.5">-</button>
                                <span class="font-bold px-1.5">${item.qty}</span>
                                <button type="button" onclick="changeQty(${idx}, 1)" class="text-emerald-300 font-bold px-1.5">+</button>
                            </div>
                            <span class="print:inline hidden font-bold px-1">x${item.qty}</span>
                            <span class="w-8 text-right text-gray-300 print:text-black">₹${item.price}</span>
                            <span class="w-10 text-right text-amber-400 print:text-black font-bold">₹${total}</span>
                        </div>
                    </div>
                `;
            }).join('');

            let discountPercent = parseFloat(document.getElementById('discountInput').value) || 0;
            let discountAmount = (sub * discountPercent) / 100;
            let taxable = sub - discountAmount;
            let tax = Math.round(taxable * 0.05);
            let grand = taxable + tax;

            subTotal.innerText = '₹' + sub;
            taxAmount.innerText = '₹' + tax;
            grandTotal.innerText = '₹' + Math.round(grand);
        }

        function saveOrder() {
            if(currentOrder.length === 0) { 
                showToast('ऑर्डर खाली है! कृपया पहले आइटम जोड़ें।', true); 
                return; 
            }
            let grandTotal = document.getElementById('grandTotal').innerText;
            ordersRef.push({
                items: currentOrder,
                total: grandTotal,
                paymentMode: selectedPayment,
                timestamp: Date.now()
            }, (err) => {
                if(!err) {
                    showToast('ऑर्डर Firebase पर सेव हो गया!');
                    currentOrder = [];
                    updateOrderUI();
                } else {
                    showToast('सेव करने में त्रुटि!', true);
                }
            });
        }

        function clearOrder() {
            if(currentOrder.length === 0) {
                showToast('ऑर्डर पहले से खाली है!', true);
                return;
            }
            currentOrder = [];
            updateOrderUI();
            showToast('KOT क्लियर कर दिया गया');
        }

        renderItems(menuItems);
    </script>
</body>
</html>
