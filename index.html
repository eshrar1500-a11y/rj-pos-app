
<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mister Shawarma POS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
body{font-size:13px;font-weight:500}
button{touch-action:manipulation}
#receipt,#kot{display:none}
@media print{
body *{visibility:hidden!important}
#receipt.printing,#receipt.printing *,
#kot.printing,#kot.printing *{visibility:visible!important}
#receipt.printing,#kot.printing{
display:block!important;position:absolute;top:0;left:0;
width:100%;padding:12px;background:white;color:black;
font:13px monospace;font-weight:bold
}}
</style>
</head>
<body class="bg-gray-950 text-white font-medium">

<!-- LOGIN -->
<div id="loginScreen" class="fixed inset-0 z-[100] bg-gray-950 flex items-center justify-center p-5">
<div class="bg-gray-900 w-full max-w-sm p-6 rounded-xl border border-gray-700">
<h1 class="text-2xl text-center font-black text-amber-400 mb-2">Mister Shawarma POS</h1>
<p class="text-center mb-5">Admin Login</p>
<label>मोबाइल नंबर</label>
<input id="loginPhone" value="8881544782" readonly class="bg-gray-800 p-3 rounded w-full mb-3">
<label>पासवर्ड</label>
<input id="loginPassword" type="password" placeholder="अपना पासवर्ड डालें" class="bg-gray-800 p-3 rounded w-full mb-3">
<button onclick="loginAdmin()" id="loginButton" class="bg-emerald-600 p-3 rounded w-full">LOGIN</button>
<p id="loginMessage" class="text-center mt-3 text-red-400"></p>
</div></div>

<div id="appShell" class="hidden h-screen flex flex-col overflow-hidden">
<header class="bg-gray-900 p-3 flex justify-between items-center">
<div><button onclick="drawer()">☰</button>
<b class="bg-white text-black px-2 rounded"><span class="text-red-600">R</span>J</b>
<span id="shopHead">Mister Shawarma</span></div>
<div class="flex gap-2">
<button id="gstButton" onclick="toggleGST()" class="bg-red-600 px-2 py-1.5 rounded">GST OFF</button>
<button onclick="settingsOpen()" class="bg-gray-800 px-2 py-1.5 rounded">⚙️ Settings</button>
</div></header>

<div id="drawerBox" class="hidden fixed inset-0 z-40 bg-black/70" onclick="this.classList.add('hidden')">
<div class="bg-gray-900 w-64 h-full p-4 space-y-3" onclick="event.stopPropagation()">
<button onclick="go('pos')">🛒 New Order</button><br>
<button onclick="menuOpen()">✏️ Edit Menu</button><br>
<button onclick="go('dashboard')">📊 Dashboard</button><br>
<button onclick="go('reports')">📈 Reports</button><br>
<button onclick="settingsOpen()">⚙️ Settings</button><hr>
<button onclick="logoutAdmin()" class="text-red-400">🚪 Logout</button>
</div></div>

<main class="flex-1 min-h-0 flex flex-col">
<div id="pos" class="flex-1 min-h-0 flex flex-col">
<div class="grid grid-cols-2 bg-gray-900 p-1">
<button id="newTab" onclick="tab('new')" class="bg-red-600 p-2 rounded">New Order</button>
<button id="billTab" onclick="tab('billing')" class="p-2">Billing / Saved Bills</button></div>

<div id="newPanel" class="flex-1 min-h-0 grid md:grid-cols-2 gap-2 p-2 overflow-auto">
<section class="bg-gray-900 rounded p-2.5 flex flex-col min-h-0">
<input id="search" placeholder="🔍 Search item..." class="bg-gray-800 p-2.5 rounded mb-2" oninput="renderMenu()">
<div class="flex gap-1.5 flex-wrap mb-2">
<button onclick="category='all';renderMenu()">All</button>
<button onclick="category='Shawarmas';renderMenu()">Shawarmas</button>
<button onclick="category='Salads';renderMenu()">Salads</button>
<button onclick="category='Open Shawarmas';renderMenu()">Open Shawarmas</button>
</div>
<div id="menuList" class="overflow-auto space-y-2"></div>
</section>

<section class="bg-gray-900 rounded p-2.5 flex flex-col min-h-0">
<div class="flex justify-between mb-2">
<span>Token <b id="token" class="text-amber-400">#1</b></span><span>👥 2 persons</span></div>
<div id="cart" class="space-y-2 overflow-auto flex-1"></div>
<input id="note" class="bg-gray-800 p-2.5 rounded my-2" placeholder="Note / Special instruction">
<div class="space-y-1.5 border-t border-gray-700 pt-2">
<div class="flex justify-between"><span>Subtotal</span><b id="subtotal">₹0</b></div>
<div class="flex justify-between items-center"><span>Discount (%)</span>
<input id="discount" type="number" value="0" class="w-16 bg-gray-800 p-1 text-right" oninput="totals()"></div>
<div class="flex justify-between"><span id="taxLabel">GST OFF</span><b id="tax">₹0</b></div>
<div class="flex justify-between bg-gray-800 p-2.5 rounded"><span>Total</span><b id="grand" class="text-amber-400">₹0</b></div>
</div>
<div class="grid grid-cols-3 gap-1.5 my-2">
<button id="cash" onclick="pay='Cash';payStyle()" class="bg-emerald-600 p-2.5 rounded">Cash</button>
<button id="card" onclick="pay='Card';payStyle()" class="bg-gray-800 p-2.5 rounded">Card</button>
<button id="due" onclick="pay='Due';payStyle()" class="bg-gray-800 p-2.5 rounded">Due</button></div>
<div class="grid grid-cols-3 gap-1.5">
<button id="saveBtn" onclick="saveBill()" class="bg-emerald-600 p-3 rounded">SAVE</button>
<button onclick="printBill()" class="bg-blue-600 p-3 rounded">PRINT</button>
<button onclick="printKot()" class="bg-amber-600 p-3 rounded">KOT</button></div>
<p id="status" class="text-center mt-2"></p>
</section></div>

<div id="billingPanel" class="hidden p-3 overflow-auto">
<button onclick="historyLoad()" class="bg-blue-600 p-2.5 rounded mb-3">Refresh Bills</button>
<div id="history" class="space-y-2"></div></div>
</div>

<div id="dashboard" class="hidden p-4"><h2 class="text-amber-400">Dashboard</h2><p id="dash"></p><button onclick="go('pos')" class="bg-red-600 p-2 rounded mt-3">Back</button></div>

<div id="reports" class="hidden p-3 overflow-auto">
<h2 class="text-amber-400 mb-2">Sale & Expense Reports</h2>
<div class="flex gap-2 flex-wrap mb-3">
<button onclick="dateReport()" class="bg-blue-600 p-2 rounded">📅 Date Report</button>
<button onclick="totalReport()" class="bg-amber-600 p-2 rounded text-black">TOTAL</button>
<button onclick="expenseForm()" class="bg-emerald-600 p-2 rounded">➕ Kharcha Add</button>
</div>
<div id="report" class="space-y-2"></div>
<button onclick="go('pos')" class="bg-red-600 p-2 rounded mt-3">Back</button>
</div>

<div id="tables" class="hidden p-4"><h2 class="text-amber-400">Running Tables</h2><button onclick="go('pos')" class="bg-red-600 p-2 rounded mt-3">Back</button></div>
</main>

<footer class="bg-gray-900 grid grid-cols-4 text-center p-2">
<button onclick="go('pos')">🛒 Order</button><button onclick="go('tables')">🪑 Tables</button><button onclick="go('reports')">📊 Reports</button><button onclick="settingsOpen()">⚙️ Settings</button>
</footer>

<div id="settings" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
<div class="bg-gray-900 p-5 rounded-xl w-full max-w-sm max-h-[90vh] overflow-auto space-y-3">
<h3 class="text-amber-400">⚙️ Restaurant Settings</h3>
<label>Shop Name</label><input id="shopName" class="bg-gray-800 p-2.5 w-full rounded">
<label>Mobile Number</label><input id="shopPhone" class="bg-gray-800 p-2.5 w-full rounded">
<label><input id="gstEnabled" type="checkbox" onchange="settingsTaxPreview()"> GST चालू करें</label>
<label>GST प्रतिशत (%)</label><input id="gstRate" type="number" class="bg-gray-800 p-2.5 w-full rounded">
<label>GST नंबर (GSTIN)</label><input id="gstNumber" class="bg-gray-800 p-2.5 w-full rounded">
<div class="flex justify-end gap-2"><button onclick="settingsClose()" class="bg-gray-700 px-4 py-2 rounded">Cancel</button><button onclick="settingsSave()" class="bg-emerald-600 px-4 py-2 rounded">Save Settings</button></div>
</div></div>

<div id="menuModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-3">
<div class="bg-gray-900 p-4 rounded-xl w-full max-w-md max-h-[90vh] flex flex-col">
<h3 class="text-amber-400 mb-2">Edit Menu</h3>
<div class="flex gap-1.5 mb-2"><input id="newName" placeholder="Item name" class="bg-gray-800 p-2.5 rounded flex-1"><input id="newPrice" type="number" placeholder="₹" class="bg-gray-800 p-2.5 rounded w-20"></div>
<div class="flex gap-1.5 mb-3"><select id="newTag" class="bg-gray-800 p-2.5 rounded flex-1"><option>Shawarmas</option><option>Salads</option><option>Open Shawarmas</option></select><button onclick="menuAdd()" class="bg-emerald-600 p-2.5 rounded">Add</button></div>
<div id="editMenu" class="overflow-auto flex-1 space-y-2"></div><button onclick="menuClose()" class="bg-red-600 p-2.5 rounded mt-2">Close</button>
</div></div>

<div id="receipt"><h2 id="rShop" style="text-align:center"></h2><p id="rGst" style="text-align:center"></p><p id="rPhone" style="text-align:center"></p><p style="text-align:center">CUSTOMER BILL</p><p>Token: <span id="rToken"></span></p><hr><div id="rItems"></div><hr><div id="rTotals"></div><p style="text-align:center;margin-top:12px">Thank You! Visit Again.</p></div>
<div id="kot"><h2 style="text-align:center">KITCHEN ORDER TICKET</h2><p>Token <span id="kToken"></span> | <span id="kTime"></span></p><hr><div id="kItems"></div><p id="kNote"></p></div>

<script>
const firebaseConfig={
apiKey:"AIzaSyDM06RpXjspQnYx5uD_JKwnkQDvffJMRy4",
databaseURL:"https://rj-billing-app-default-rtdb.firebaseio.com/",
projectId:"rj-billing-app",
storageBucket:"rj-billing-app.firebasestorage.app"
};
let db=null,auth=null;
try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);db=firebase.database();auth=firebase.auth()}catch(e){console.error(e)}
const ADMIN_PHONE="8881544782",ADMIN_EMAIL=ADMIN_PHONE+"@rjpos.app";
async function loginAdmin(){
let phone=loginPhone.value.trim(),password=loginPassword.value;
if(phone!==ADMIN_PHONE)return loginMessage.textContent="गलत मोबाइल नंबर";
if(!password)return loginMessage.textContent="पासवर्ड डालें";
loginButton.disabled=true;loginButton.textContent="LOGIN हो रहा है...";
try{await auth.signInWithEmailAndPassword(ADMIN_EMAIL,password);loginMessage.textContent=""}
catch(e){loginMessage.textContent="Login नहीं हुआ: "+e.message}
finally{loginButton.disabled=false;loginButton.textContent="LOGIN"}
}
function logoutAdmin(){if(confirm("क्या Logout करना चाहते हैं?"))auth.signOut()}
auth?.onAuthStateChanged(user=>{
let ok=!!(user&&user.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase());
loginScreen.classList.toggle('hidden',ok);appShell.classList.toggle('hidden',!ok);
if(!ok){loginPassword.value="";if(user)auth.signOut()}
});

let shop=localStorage.getItem('rj_shop_name')||'Mister Shawarma';
let shopPhone=localStorage.getItem('rj_shop_phone')||'',pay='Cash',cart=[],category='all',ordersCache={},expensesCache={};
let gstEnabled=localStorage.getItem('rj_gst_enabled')==='true',gstRate=Number(localStorage.getItem('rj_gst_rate')||5),gstNumber=localStorage.getItem('rj_gst_number')||'';
const defaultItems=[
['CLASSIC CHICKEN SHAWARMA',60,'Shawarmas'],['PIRI PIRI CHICKEN SHAWARMA',70,'Shawarmas'],['ACHARI CHICKEN SHAWARMA',70,'Shawarmas'],['FIERY CHICKEN SHAWARMA',70,'Shawarmas'],['CHILLI MILLI CHICKEN SHAWARMA',70,'Shawarmas'],['BBQ CHICKEN SHAWARMA',80,'Shawarmas'],['CHICKEN TIKKA SHAWARMA',90,'Shawarmas'],['FIRANGI CHICKEN SHAWARMA',90,'Shawarmas'],['HUMMUS CHICKEN SHAWARMA',100,'Shawarmas'],
['CLASSIC CHICKEN SALAD',160,'Salads'],['FIRANGI CHICKEN SALAD',180,'Salads'],['PIRI PIRI CHICKEN SALAD',170,'Salads'],['ACHARI CHICKEN SALAD',170,'Salads'],['FIERY CHICKEN SALAD',170,'Salads'],['CHICKEN TIKKA SALAD',180,'Salads'],['BBQ CHICKEN SALAD',170,'Salads'],['CHILLI MILLI CHICKEN SALAD',170,'Salads'],['HUMMUS CHICKEN SALAD',180,'Salads'],
['CLASSIC CHICKEN SHAWARMA',135,'Open Shawarmas'],['PIRI PIRI CHICKEN SHAWARMA',135,'Open Shawarmas'],['ACHARI CHICKEN SHAWARMA',135,'Open Shawarmas'],['FIERY CHICKEN SHAWARMA',135,'Open Shawarmas'],['CHILLI MILLI CHICKEN SHAWARMA',135,'Open Shawarmas'],['BBQ CHICKEN SHAWARMA',135,'Open Shawarmas'],['CHICKEN TIKKA SHAWARMA',135,'Open Shawarmas'],['FIRANGI CHICKEN SHAWARMA',135,'Open Shawarmas'],['HUMMUS CHICKEN SHAWARMA',135,'Open Shawarmas']];
let menu=JSON.parse(localStorage.getItem('rj_menu_items')||'null')||defaultItems.map(x=>({name:x[0],price:x[1],tag:x[2]}));
const money=n=>'₹'+Math.round(Number(n)||0);
function msg(t,err=false){status.textContent=t;status.className='text-center mt-2 '+(err?'text-red-400':'text-emerald-400')}
function drawer(){drawerBox.classList.toggle('hidden')}
function go(v){['pos','dashboard','reports','tables'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(v).classList.remove('hidden');if(v==='pos')tab('new');if(v==='dashboard'||v==='reports')stats()}
function tab(t){newPanel.classList.toggle('hidden',t!=='new');billingPanel.classList.toggle('hidden',t!=='billing');newTab.className=t==='new'?'bg-red-600 p-2 rounded':'p-2';billTab.className=t==='billing'?'bg-red-600 p-2 rounded':'p-2';if(t==='billing')historyLoad()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderMenu(){let q=search.value.toLowerCase(),arr=menu.filter(x=>x.name.toLowerCase().includes(q)&&(category==='all'||x.tag===category));menuList.innerHTML=arr.map(x=>`<div class="flex justify-between items-center bg-gray-800 p-2.5 rounded"><div><b>${esc(x.name)}</b><p class="text-amber-400">${money(x.price)}</p></div><button class="bg-emerald-600 px-3 py-2 rounded" onclick="addItem(${JSON.stringify(x.name).replace(/"/g,'&quot;')},${+x.price})">ADD</button></div>`).join('')||'No items found'}
function addItem(n,p){let x=cart.find(i=>i.name===n);x?x.qty++:cart.push({name:n,price:+p,qty:1});drawCart()}
function qty(i,d){cart[i].qty+=d;if(cart[i].qty<1)cart.splice(i,1);drawCart()}
function drawCart(){tokenDisplay();cartBox();totals()}
function tokenDisplay(){token.textContent='#'+nextToken}
function cartBox(){cartElement.innerHTML=cart.length?cart.map((x,i)=>`<div class="flex justify-between items-center bg-gray-800 p-2 rounded text-xs"><span class="truncate flex-1">${esc(x.name)}</span><button onclick="qty(${i},-1)" class="px-2">×</button><b class="px-2">${x.qty}</b><button onclick="qty(${i},1)" class="px-2">+</button><span class="text-amber-300 ml-1">${money(x.price*x.qty)}</span><button onclick="cart.splice(${i},1);drawCart()" class="text-red-400 ml-2">🗑️</button></div>`).join(''):'<p class="text-center text-gray-400 py-4">No items added yet.</p>'}
const cartElement=document.getElementById('cart');
function totals(){let sub=cart.reduce((s,x)=>s+x.price*x.qty,0),dp=Math.min(100,Math.max(0,+discount.value||0)),disc=sub*dp/100,taxable=sub-disc,tax=gstEnabled?Math.round(taxable*gstRate/100):0,grand=Math.round(taxable+tax);subtotal.textContent=money(sub);taxEl.textContent=money(tax);taxLabel.textContent=gstEnabled?`GST ${gstRate}%`:'GST OFF';grandEl.textContent=money(grand);return{sub,dp,disc,tax,grand}}
const subtotal=document.getElementById('subtotal'),taxEl=document.getElementById('tax'),grandEl=document.getElementById('grand');
function payStyle(){['Cash','Card','Due'].forEach(x=>document.getElementById(x.toLowerCase()).className=(pay===x?'bg-emerald-600':'bg-gray-800')+' p-2.5 rounded')}
function updateGSTButton(){gstButton.textContent=gstEnabled?'GST ON':'GST OFF';gstButton.className=(gstEnabled?'bg-emerald-600':'bg-red-600')+' px-2.5 py-1.5 rounded'}
function toggleGST(){gstEnabled=!gstEnabled;localStorage.setItem('rj_gst_enabled',gstEnabled);gstEnabledEl.checked=gstEnabled;updateGSTButton();totals();msg(gstEnabled?'GST चालू':'GST बंद')}
function indiaDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
let activeDate=indiaDate(),nextToken=1,tokenRef=null;
function listenToken(){if(!db||!auth?.currentUser)return;let key=indiaDate();if(key===activeDate&&tokenRef)return;activeDate=key;if(tokenRef)tokenRef.off();tokenRef=db.ref('dailyTokens/'+key);tokenRef.on('value',s=>{nextToken=(Number(s.val())||0)+1;tokenDisplay()})}
setInterval(()=>{if(indiaDate()!==activeDate){tokenRef?.off();tokenRef=null;listenToken()}},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)listenToken()});
async function reserveToken(){let key=indiaDate(),r=await db.ref('dailyTokens/'+key).transaction(v=>(Number(v)||0)+1);if(!r.committed)throw Error('Token reserve नहीं हुआ');return{number:r.snapshot.val(),dateKey:key}}
async function saveBill(){if(!cart.length)return msg('ऑर्डर खाली है!',true);if(!db||!auth?.currentUser)return msg('पहले Login/Firebase जाँचें',true);saveBtn.disabled=true;saveBtn.textContent='Saving…';try{let t=totals(),reserved=await reserveToken(),data={token:reserved.number,dateKey:reserved.dateKey,items:cart.map(x=>({...x})),subtotal:t.sub,discountPercent:t.dp,discountAmount:Math.round(t.disc),tax:t.tax,gstEnabled,gstRate:gstEnabled?gstRate:0,gstNumber:gstEnabled?gstNumber:'',total:t.grand,paymentMode:pay,note:note.value||'',shopName:shop,shopPhone,timestamp:Date.now()};let pushed=await db.ref('orders').push(data);if(!pushed.key)throw Error('Bill ID नहीं मिला');msg('बिल सेव ✓ Token #'+reserved.number);cart=[];note.value='';discount.value=0;drawCart();historyLoad()}catch(e){msg('SAVE नहीं हुआ: '+e.message,true);alert('Save Error: '+e.message)}finally{saveBtn.disabled=false;saveBtn.textContent='SAVE'}}
function receiptData(order){let t=totals(),items=order?order.items:cart,sub=order?order.subtotal:t.sub,dp=order?order.discountPercent:t.dp,disc=order?order.discountAmount:Math.round(t.disc),tax=order?order.tax:t.tax,grand=order?order.total:t.grand,enabled=order?!!order.gstEnabled:gstEnabled,rate=order?Number(order.gstRate||0):gstRate,num=order?order.gstNumber:gstNumber,phone=order?order.shopPhone:shopPhone;rShop.textContent=order?.shopName||shop;rGst.textContent=num?'GSTIN: '+num:'';rPhone.textContent=phone?'Phone: '+phone:'';rToken.textContent='#'+(order?.token||nextToken);rItems.innerHTML=(items||[]).map(i=>`<div style="display:flex;justify-content:space-between;margin:4px 0"><span>${esc(i.name)} ×${i.qty}</span><span>${money(i.price*i.qty)}</span></div>`).join('');rTotals.innerHTML=`<p>Subtotal: ${money(sub)}</p>${dp?`<p>Discount (${dp}%): -${money(disc)}</p>`:''}${enabled?`<p>GST ${rate}%: ${money(tax)}</p>`:'<p>GST OFF</p>'}<h3>Total: ${money(grand)}</h3><p>Payment: ${order?.paymentMode||pay}</p>`}
function printBill(){if(!cart.length)return msg('ऑर्डर खाली है!',true);receiptData();printEl('receipt')}
function printEl(id){let el=document.getElementById(id);el.classList.add('printing');window.addEventListener('afterprint',()=>el.classList.remove('printing'),{once:true});window.print();setTimeout(()=>el.classList.remove('printing'),1500)}
function printKot(){if(!cart.length)return msg('ऑर्डर खाली है!',true);kToken.textContent='#'+nextToken;kTime.textContent=new Date().toLocaleString('en-IN');kItems.innerHTML=cart.map(x=>`<p style="display:flex;justify-content:space-between"><span>${esc(x.name)}</span><span>Qty ${x.qty}</span></p>`).join('');kNote.textContent=note.value;printEl('kot')}
function historyLoad(){history.innerHTML='Loading…';db.ref('orders').once('value').then(s=>{ordersCache=s.val()||{};history.innerHTML=Object.entries(ordersCache).reverse().map(([k,o])=>`<div class="bg-gray-900 p-3 rounded border border-gray-800 flex justify-between gap-2 text-xs"><div><b class="text-amber-400">Token #${o.token}</b> ${money(o.total)}<p>${(o.items||[]).map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</p><small>${new Date(o.timestamp).toLocaleString('en-IN')} | ${o.paymentMode}</small></div><button class="bg-blue-600 px-3 py-2 rounded" onclick="duplicate('${k}')">Duplicate Print</button></div>`).join('')||'No saved bills'}).catch(e=>history.textContent='Firebase Error: '+e.message)}
function duplicate(k){let o=ordersCache[k];if(o){receiptData(o);printEl('receipt')}}
function dateOf(o){return o.dateKey||new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(o.timestamp||0))}
async function getData(){let [os,es]=await Promise.all([db.ref('orders').once('value'),db.ref('expenses').once('value')]);ordersCache=os.val()||{};expensesCache=es.val()||{};return{orders:Object.values(ordersCache),expenses:Object.values(expensesCache)}}
async function stats(){try{let {orders,expenses}=await getData(),today=indiaDate(),sales=orders.filter(o=>dateOf(o)===today).reduce((n,o)=>n+(+o.total||0),0),exp=expenses.filter(e=>e.dateKey===today).reduce((n,e)=>n+(+e.amount||0),0);dash.textContent=`आज Sale: ${money(sales)} | Orders: ${orders.filter(o=>dateOf(o)===today).length} | Kharcha: ${money(exp)} | Net: ${money(sales-exp)}`;report.innerHTML=`<div class="bg-gray-900 p-3 rounded">आज Sale: ${money(sales)}<br>आज Kharcha: ${money(exp)}<br>आज Net: ${money(sales-exp)}<br>Total Sale: ${money(orders.reduce((n,o)=>n+(+o.total||0),0))}<br>Total Kharcha: ${money(expenses.reduce((n,e)=>n+(+e.amount||0),0))}</div>`}catch(e){report.textContent='Firebase: '+e.message}}
async function dateReport(){let d=prompt('Report तारीख (YYYY-MM-DD)',indiaDate());if(!d)return;try{let {orders,expenses}=await getData(),a=orders.filter(o=>dateOf(o)===d),ex=expenses.filter(e=>e.dateKey===d),sale=a.reduce((n,o)=>n+(+o.total||0),0),kh=ex.reduce((n,e)=>n+(+e.amount||0),0);report.innerHTML=`<div class="bg-gray-900 p-3 rounded"><b>${d} Report</b><br>Bills: ${a.length}<br>Sale: ${money(sale)}<br>Kharcha: ${money(kh)}<br>Net: ${money(sale-kh)}<hr>${ex.map(e=>esc(e.title)+' — '+money(e.amount)).join('<br>')||'खर्च नहीं'}</div>`}catch(e){report.textContent=e.message}}
async function totalReport(){try{let {orders,expenses}=await getData(),days={};orders.forEach(o=>{let d=dateOf(o);days[d]??={sale:0,bills:0,expense:0};days[d].sale+=+o.total||0;days[d].bills++});expenses.forEach(e=>{let d=e.dateKey;days[d]??={sale:0,bills:0,expense:0};days[d].expense+=+e.amount||0});let sale=orders.reduce((n,o)=>n+(+o.total||0),0),kh=expenses.reduce((n,e)=>n+(+e.amount||0),0);report.innerHTML=`<div class="bg-gray-900 p-3 rounded mb-2"><b>ALL TIME TOTAL</b><br>Total Sale: ${money(sale)}<br>Total Kharcha: ${money(kh)}<br>Net: ${money(sale-kh)}<br>Total Bills: ${orders.length}</div>`+Object.keys(days).sort().reverse().map(d=>`<div class="bg-gray-900 p-3 rounded mb-2"><b>${d}</b><br>Bills: ${days[d].bills}<br>Sale: ${money(days[d].sale)}<br>Kharcha: ${money(days[d].expense)}<br>Net: ${money(days[d].sale-days[d].expense)}</div>`).join('')}catch(e){report.textContent=e.message}}
function expenseForm(){let d=prompt('खर्च तारीख (YYYY-MM-DD)',indiaDate());if(!d)return;let title=prompt('खर्च का नाम');if(!title)return;let amount=Number(prompt('खर्च रकम ₹'));if(!amount||amount<=0)return alert('सही रकम डालें');db.ref('expenses').push({dateKey:d,title,amount,timestamp:Date.now()}).then(()=>{msg('Kharcha सेव ✓');stats()}).catch(e=>alert('Expense save error: '+e.message))}
function settingsOpen(){shopName.value=shop;shopPhoneInput.value=shopPhone;gstEnabledEl.checked=gstEnabled;gstRateEl.value=gstRate;gstNumberEl.value=gstNumber;settings.classList.remove('hidden')}
const gstEnabledEl=document.getElementById('gstEnabled'),gstRateEl=document.getElementById('gstRate'),gstNumberEl=document.getElementById('gstNumber'),shopPhoneInput=document.getElementById('shopPhone');
function settingsTaxPreview(){gstEnabled=gstEnabledEl.checked;gstRate=Math.max(0,Number(gstRateEl.value)||0);updateGSTButton();totals()}
function settingsClose(){settings.classList.add('hidden')}
function settingsSave(){shop=shopName.value.trim()||'Mister Shawarma';shopPhone=shopPhoneInput.value.trim();gstEnabled=gstEnabledEl.checked;gstRate=Math.max(0,Number(gstRateEl.value)||0);gstNumber=gstNumberEl.value.trim().toUpperCase();localStorage.setItem('rj_shop_name',shop);localStorage.setItem('rj_shop_phone',shopPhone);localStorage.setItem('rj_gst_enabled',gstEnabled);localStorage.setItem('rj_gst_rate',gstRate);localStorage.setItem('rj_gst_number',gstNumber);shopHead.textContent=shop;updateGSTButton();settingsClose();totals();msg('Settings सेव ✓')}
function menuOpen(){menuModal.classList.remove('hidden');editMenuRender()}function menuClose(){menuModal.classList.add('hidden');renderMenu()}
function menuAdd(){let n=newName.value.trim(),p=+newPrice.value||0,tg=newTag.value;if(!n)return alert('Item name लिखें');menu.push({name:n,price:p,tag:tg});menuSave();newName.value='';newPrice.value='';editMenuRender()}
function menuSave(){localStorage.setItem('rj_menu_items',JSON.stringify(menu))}
function editMenuRender(){editMenu.innerHTML=menu.map((x,i)=>`<div class="flex gap-1.5 items-center"><input class="bg-gray-800 p-2 rounded flex-1" value="${esc(x.name)}" onchange="menu[${i}].name=this.value;menuSave()"><input class="bg-gray-800 p-2 rounded w-16" type="number" value="${x.price}" onchange="menu[${i}].price=+this.value;menuSave()"><select class="bg-gray-800 p-2 rounded" onchange="menu[${i}].tag=this.value"><option ${x.tag==='Shawarmas'?'selected':''}>Shawarmas</option><option ${x.tag==='Salads'?'selected':''}>Salads</option><option ${x.tag==='Open Shawarmas'?'selected':''}>Open Shawarmas</option></select><button onclick="menu.splice(${i},1);menuSave();editMenuRender()" class="text-red-400 px-2">✕</button></div>`).join('')}
shopHead.textContent=shop;updateGSTButton();renderMenu();drawCart();payStyle();auth?.onAuthStateChanged(u=>{if(u)listenToken()});
</script>
</body></html>
