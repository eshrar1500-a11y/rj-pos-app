
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RJ Mister Shawarma POS</title>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#fff;font-family:Arial}
header{background:#172554;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
button{border:0;padding:11px;border-radius:8px;color:white;background:#2563eb;font-weight:bold;cursor:pointer}
input,select{padding:10px;border-radius:7px;border:1px solid #64748b;width:100%;margin:5px 0;background:#fff;color:#111}
.card{background:#1e293b;padding:14px;margin:10px;border-radius:12px}
h3{margin-top:5px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.item{background:#334155;padding:12px;border-radius:8px;text-align:center}
.item button{margin-top:7px}
.green{background:#15803d}
.red{background:#dc2626}
.orange{background:#c2410c}
.small{font-size:12px;color:#cbd5e1}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:7px 0}
#drawer{display:none;background:#172554;padding:10px}
#drawer button{margin:4px}
.hidden{display:none}
table{width:100%;border-collapse:collapse}
td,th{border-bottom:1px solid #475569;padding:8px;text-align:left}
</style>
</head>

<body>

<header>
<div>
<b>RJ MISTER SHAWARMA</b>
<div class="small">Billing & Sales Report</div>
</div>
<div style="display:flex;gap:5px">
<button id="gstButton" class="red" onclick="toggleGST()">GST OFF</button>
<button onclick="toggleDrawer()">☰</button>
</div>
</header>

<div id="drawer">
<button onclick="showPage('billing')">Billing</button>
<button onclick="showPage('saved')">Saved Bills</button>
<button onclick="showPage('reports')">Reports</button>
<button onclick="showPage('settings')">Settings</button>
</div>

<!-- BILLING -->
<section id="billing" class="page">

<div class="card">
<h3>New Order / Billing</h3>
<input id="customer" placeholder="Customer Name">
<input id="mobile" placeholder="Mobile Number">
<input id="search" placeholder="Menu Search" oninput="renderMenu()">
<div id="menu" class="grid"></div>
</div>

<div class="card">
<h3>🛒 Cart</h3>
<div id="cart"></div>

<div class="row"><span>Subtotal</span><b id="subtotal">₹0</b></div>
<div class="row"><span>Discount ₹</span>
<input id="discount" type="number" value="0" style="width:100px" oninput="renderCart()">
</div>
<div class="row"><span>GST</span><b id="tax">₹0</b></div>
<div class="row"><h3>Total</h3><h3 id="grand">₹0</h3></div>

<select id="payment">
<option>Cash</option>
<option>Card</option>
<option>UPI</option>
<option>Due</option>
</select>

<button class="green" onclick="saveBill()">💾 SAVE BILL</button>
<button onclick="printBill()">🖨 PRINT</button>
<button class="orange" onclick="printKOT()">KOT</button>
<button class="red" onclick="clearCart()">Clear Cart</button>
</div>

</section>

<!-- SAVED -->
<section id="saved" class="page hidden">
<div class="card">
<h3>Saved Bills</h3>
<button onclick="loadBills()">Refresh</button>
<div id="savedBills"></div>
</div>
</section>

<!-- REPORTS -->
<section id="reports" class="page hidden">
<div class="card">
<h3>Reports</h3>
<input type="date" id="reportDate">
<button onclick="loadReports()">Show Report</button>
<hr>
<p>Daily Sale: <b id="daily">₹0</b></p>
<p>Total Sale: <b id="totalSale">₹0</b></p>
<p>Total Kharcha: <b id="expenseTotal">₹0</b></p>
<button onclick="addExpense()">➕ Add Kharcha</button>
<button onclick="whatsappReport()">WhatsApp Report</button>
<div id="expenses"></div>
</div>
</section>

<!-- SETTINGS -->
<section id="settings" class="page hidden">
<div class="card">
<h3>⚙️ Settings</h3>
<label>Shop Name</label>
<input id="shopName" value="RJ MISTER SHAWARMA">
<label>GST चालू करें</label>
<input type="checkbox" id="gstCheck" onchange="settingsTaxPreview()" style="width:auto">
<label>GST Rate (%)</label>
<input id="gstRate" type="number" value="5">
<label>GSTIN</label>
<input id="gstNumber" placeholder="GSTIN Number">
<button onclick="saveSettings()">Save Settings</button>
<hr>
<h3>Menu Edit</h3>
<input id="newItem" placeholder="Item Name">
<input id="newPrice" type="number" placeholder="Price">
<button onclick="addMenuItem()">Add Menu Item</button>
<div id="menuEdit"></div>
</div>
</section>

<script>
const firebaseConfig={
apiKey:"AIzaSyDM06RpXjspQnYx5uD_JKwnkQDvffJMRy4",
databaseURL:"https://rj-billing-app-default-rtdb.firebaseio.com/",
projectId:"rj-billing-app",
storageBucket:"rj-billing-app.firebasestorage.app"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let cart=[];
let bills=[];
let expenses=[];
let menuItems=[
{name:"Chicken Shawarma",price:120},
{name:"Chicken Roll",price:100},
{name:"Rumali Shawarma",price:150},
{name:"Special Shawarma",price:180},
{name:"Cold Drink",price:40},
{name:"French Fries",price:80}
];

let gstEnabled=localStorage.getItem("rj_gst_enabled")==="true";
let gstRate=Number(localStorage.getItem("rj_gst_rate")||5);
let gstNumber=localStorage.getItem("rj_gst_number")||"";
let shopName=localStorage.getItem("rj_shop_name")||"RJ MISTER SHAWARMA";

function money(n){return "₹"+Number(n||0).toFixed(2)}

function toggleDrawer(){
let d=document.getElementById("drawer");
d.style.display=d.style.display==="block"?"none":"block";
}

function showPage(id){
document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
document.getElementById("drawer").style.display="none";
if(id==="saved")loadBills();
if(id==="reports")loadReports();
if(id==="settings")openSettings();
}

function updateGSTButton(){
let b=document.getElementById("gstButton");
b.textContent=gstEnabled?"GST ON":"GST OFF";
b.className=gstEnabled?"green":"red";
}

function toggleGST(){
gstEnabled=!gstEnabled;
localStorage.setItem("rj_gst_enabled",gstEnabled);
document.getElementById("gstCheck").checked=gstEnabled;
updateGSTButton();
renderCart();
}

function settingsTaxPreview(){
gstEnabled=document.getElementById("gstCheck").checked;
updateGSTButton();
}

function openSettings(){
document.getElementById("shopName").value=shopName;
document.getElementById("gstCheck").checked=gstEnabled;
document.getElementById("gstRate").value=gstRate;
document.getElementById("gstNumber").value=gstNumber;
renderMenuEdit();
}

function saveSettings(){
shopName=document.getElementById("shopName").value||"RJ MISTER SHAWARMA";
gstEnabled=document.getElementById("gstCheck").checked;
gstRate=Number(document.getElementById("gstRate").value||5);
gstNumber=document.getElementById("gstNumber").value;
localStorage.setItem("rj_shop_name",shopName);
localStorage.setItem("rj_gst_enabled",gstEnabled);
localStorage.setItem("rj_gst_rate",gstRate);
localStorage.setItem("rj_gst_number",gstNumber);
updateGSTButton();
renderCart();
alert("Settings Saved");
}

function renderMenu(){
let q=document.getElementById("search").value.toLowerCase();
let html="";
menuItems.filter(x=>x.name.toLowerCase().includes(q)).forEach((x,i)=>{
html+=`<div class="item">
<b>${x.name}</b><br>${money(x.price)}
<br><button onclick="addCart('${x.name.replace(/'/g,"")}')">ADD +</button>
</div>`;
});
document.getElementById("menu").innerHTML=html;
}

function addCart(name){
let item=menuItems.find(x=>x.name===name);
if(!item)return;
let found=cart.find(x=>x.name===name);
if(found)found.qty++;
else cart.push({name:item.name,price:item.price,qty:1});
renderCart();
}

function renderCart(){
let html="",sub=0;
cart.forEach((x,i)=>{
let total=x.price*x.qty;
sub+=total;
html+=`<div class="row">
<span>${x.name}<br>${money(x.price)} × ${x.qty}</span>
<div>
<button onclick="changeQty(${i},-1)">−</button>
<button onclick="changeQty(${i},1)">+</button>
<button class="red" onclick="removeItem(${i})">×</button>
</div>
</div>`;
});
let disc=Number(document.getElementById("discount").value||0);
disc=Math.min(disc,sub);
let tax=gstEnabled?Math.round((sub-disc)*gstRate/100):0;
let grand=Math.round(sub-disc+tax);

document.getElementById("cart").innerHTML=html||"Cart Empty";
document.getElementById("subtotal").textContent=money(sub);
document.getElementById("tax").textContent=money(tax);
document.getElementById("grand").textContent=money(grand);
return {sub,disc,tax,grand};
}

function changeQty(i,n){
cart[i].qty+=n;
if(cart[i].qty<=0)cart.splice(i,1);
renderCart();
}

function removeItem(i){cart.splice(i,1);renderCart()}
function clearCart(){cart=[];renderCart()}

async function saveBill(){
if(!cart.length){alert("Cart Empty");return}
let t=renderCart();
let bill={
customer:document.getElementById("customer").value||"Customer",
mobile:document.getElementById("mobile").value||"",
items:cart.map(x=>({...x})),
subtotal:t.sub,
discount:t.disc,
gst:t.tax,
gstEnabled,
gstRate,
gstNumber,
total:t.grand,
payment:document.getElementById("payment").value,
date:new Date().toISOString(),
time:new Date().toLocaleString("en-IN"),
shop:shopName
};

try{
await db.ref("orders").push(bill);
alert("Bill Saved Successfully");
cart=[];
document.getElementById("customer").value="";
document.getElementById("mobile").value="";
document.getElementById("discount").value=0;
renderCart();
}catch(e){
alert("Save Error: "+e.message);
}
}

async function loadBills(){
let box=document.getElementById("savedBills");
box.innerHTML="Loading...";
try{
let snap=await db.ref("orders").once("value");
bills=[];
snap.forEach(s=>bills.push({id:s.key,...s.val()}));
bills.reverse();
box.innerHTML=bills.map(b=>`
<div class="card">
<b>${b.customer}</b><br>${b.time||b.date}
<br>Total: ${money(b.total)} | ${b.payment}
<br><button onclick="viewBill('${b.id}')">View</button>
<button onclick="shareBill('${b.id}')">WhatsApp</button>
</div>`).join("")||"No Bills";
}catch(e){box.innerHTML=e.message}
}

function viewBill(id){
let b=bills.find(x=>x.id===id);
if(!b)return;
alert("Customer: "+b.customer+"\nTotal: "+money(b.total)+"\nPayment: "+b.payment);
}

function shareBill(id){
let b=bills.find(x=>x.id===id);
if(!b)return;
let text=`${b.shop}\nCustomer: ${b.customer}\nTotal: ${money(b.total)}\nPayment: ${b.payment}`;
window.open("https://wa.me/?text="+encodeURIComponent(text));
}

function printBill(){
let t=renderCart();
let text=`<h2>${shopName}</h2>
<h3>Bill</h3>
Customer: ${document.getElementById("customer").value}<hr>
${cart.map(x=>`${x.name} × ${x.qty} = ${money(x.price*x.qty)}<br>`).join("")}
<hr>Subtotal: ${money(t.sub)}<br>
Discount: ${money(t.disc)}<br>
GST: ${money(t.tax)}<br>
<h3>Total: ${money(t.grand)}</h3>`;
let w=window.open("","","width=400,height=600");
w.document.write(text);
w.document.close();
w.print();
}

function printKOT(){
let text=`<h2>${shopName}</h2><h3>KOT</h3>
${cart.map(x=>`${x.name} × ${x.qty}<br>`).join("")}`;
let w=window.open("","","width=400,height=600");
w.document.write(text);
w.document.close();
w.print();
}

function addMenuItem(){
let name=document.getElementById("newItem").value;
let price=Number(document.getElementById("newPrice").value);
if(!name||price<=0){alert("Name aur Price bhare");return}
menuItems.push({name,price});
localStorage.setItem("rj_menu",JSON.stringify(menuItems));
document.getElementById("newItem").value="";
document.getElementById("newPrice").value="";
renderMenu();
renderMenuEdit();
}

function renderMenuEdit(){
document.getElementById("menuEdit").innerHTML=menuItems.map((x,i)=>`
<div class="row">${x.name} - ${money(x.price)}
<button class="red" onclick="deleteMenu(${i})">Delete</button></div>`).join("");
}

function deleteMenu(i){
menuItems.splice(i,1);
localStorage.setItem("rj_menu",JSON.stringify(menuItems));
renderMenu();
renderMenuEdit();
}

function loadReports(){
let date=document.getElementById("reportDate").value;
if(!date)date=new Date().toISOString().slice(0,10);
db.ref("orders").once("value").then(s=>{
let all=[];
s.forEach(x=>all.push(x.val()));
let daily=all.filter(b=>(b.date||"").slice(0,10)===date);
document.getElementById("daily").textContent=money(daily.reduce((a,b)=>a+Number(b.total||0),0));
document.getElementById("totalSale").textContent=money(all.reduce((a,b)=>a+Number(b.total||0),0));
});
loadExpenses();
}

async function addExpense(){
let amount=prompt("Kharcha Amount");
if(!amount||Number(amount)<=0)return;
let note=prompt("Kharcha kis liye?");
await db.ref("expenses").push({
amount:Number(amount),
note:note||"Expense",
date:new Date().toISOString(),
time:new Date().toLocaleString("en-IN")
});
loadExpenses();
loadReports();
}

async function loadExpenses(){
let snap=await db.ref("expenses").once("value");
expenses=[];
snap.forEach(x=>expenses.push(x.val()));
let total=expenses.reduce((a,b)=>a+Number(b.amount||0),0);
document.getElementById("expenseTotal").textContent=money(total);
document.getElementById("expenses").innerHTML=expenses.map(x=>
`<p>${x.note}: ${money(x.amount)}</p>`).join("");
}

function whatsappReport(){
let text=`${shopName}\nDaily Sale: ${document.getElementById("daily").textContent}\nTotal Sale: ${document.getElementById("totalSale").textContent}\nKharcha: ${document.getElementById("expenseTotal").textContent}`;
window.open("https://wa.me/?text="+encodeURIComponent(text));
}

let savedMenu=localStorage.getItem("rj_menu");
if(savedMenu){try{menuItems=JSON.parse(savedMenu)}catch(e){}}

updateGSTButton();
renderMenu();
renderCart();
document.getElementById("reportDate").value=new Date().toISOString().slice(0,10);
</script>
</body>
</html>
