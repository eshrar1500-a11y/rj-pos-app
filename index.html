<main class="flex-1 min-h-0 flex flex-col">

<section class="bg-gray-900 rounded p-2.5 flex flex-col min-h-0">
<div class="flex justify-between mb-2 font-bold text-xs">

<div class="flex justify-between items-center text-gray-300">
<span>Discount (%)</span>
<input id="discount" type="number" value="0" min="0" max="100"
class="w-16 bg-gray-800 p-1 text-right text-white font-bold rounded" oninput="totals()">
</div>

<span id="taxLabel">GST OFF</span><b id="tax" class="text-white">₹0</b>

</div>
</div>

<div class="grid grid-cols-3 gap-1.5 my-2 font-bold text-xs">
<button id="cash" onclick="pay='Cash';payStyle()" class="bg-emerald-600 p-2.5 rounded shadow">Cash</button>
<button id="card" onclick="pay='Card';payStyle()" class="bg-gray-800 border border-gray-700 p-2.5 rounded text-gray-300 shadow">Card</button>

<p id="dash" class="text-sm text-gray-200"></p>
<button onclick="go('pos')" class="bg-red-600 p-2 rounded mt-3 text-xs font-bold shadow">Back</button>
</div>

<div id="reports" class="hidden p-4 font-bold">
<h2 class="text-base text-amber-400 font-black mb-2">Sale Reports</h2>
<div id="report" class="text-sm text-gray-200"></div>
<button onclick="go('pos')" class="bg-red-600 p-2 rounded mt-3 text-xs font-bold shadow">Back</button>
</div>

<div id="tables" class="hidden p-4 font-bold">

</main>

<button onclick="go('tables')" class="text-gray-300">🪑 Tables</button>
<button onclick="go('reports')" class="text-gray-300">📊 Reports</button>
<button onclick="settingsOpen()" class="text-gray-300">⚙️ Settings</button>
</footer>

<div id="settings" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
<div class="bg-gray-900 p-5 rounded-xl w-full max-w-sm max-h-[90vh] overflow-auto font-bold text-xs border border-gray-700 shadow-2xl space-y-3">
<h3 class="text-amber-400 font-black text-base mb-1">⚙️ Restaurant Settings</h3>
<label class="block mb-1 text-gray-300">Shop Name</label>
<input id="shopName" class="bg-gray-800 p-2.5 w-full rounded text-white font-bold outline-none border border-gray-700">

<label class="block mb-1 text-gray-300">Mobile Number</label>
<input id="shopPhone" class="bg-gray-800 p-2.5 w-full rounded text-white font-bold outline-none border border-gray-700" placeholder="दुकान का फोन नंबर">

<label class="flex items-center gap-2 mb-2 text-gray-200 pt-1">
<input id="gstEnabled" type="checkbox" onchange="settingsTaxPreview()" class="w-4 h-4">
GST चालू करें

class="bg-gray-800 p-2.5 w-full rounded text-white font-bold outline-none border border-gray-700">

<label class="block mb-1 text-gray-300">GST नंबर (GSTIN)</label>
<input id="gstNumber" class="bg-gray-800 p-2.5 w-full rounded text-white font-bold outline-none border border-gray-700 uppercase" placeholder="GST नंबर">

<div class="flex justify-end gap-2 pt-2 border-t border-gray-800">
<button onclick="settingsClose()" class="bg-gray-700 px-4 py-2 rounded text-white font-bold">Cancel</button>

<div id="menuModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-3">
<div class="bg-gray-900 p-4 rounded-xl w-full max-w-md max-h-[90vh] flex flex-col font-bold text-xs border border-gray-700 shadow-2xl">
<h3 class="text-amber-400 font-black text-sm mb-2">Edit Menu</h3>
<div class="flex gap-1.5 mb-2">
<input id="newName" placeholder="Item name" class="bg-gray-800 p-2.5 rounded flex-1 text-white font-bold outline-none border border-gray-700">
<input id="newPrice" type="number" placeholder="₹" class="bg-gray-800 p-2.5 rounded w-20 text-white font-bold outline-none border border-gray-700">
</div>
<div class="flex gap-1.5 mb-3">
<select id="newTag" class="bg-gray-800 p-2.5 rounded flex-1 text-white font-bold outline-none border border-gray-700">
<option value="Shawarmas">Shawarmas</option>
<option value="Salads">Salads</option>

<button onclick="menuClose()" class="bg-red-600 p-2.5 rounded text-white font-black mt-2 shadow">Close</button>

<div id="receipt">
<h2 id="rShop" style="text-align:center;font-weight:bold;font-size:16px"></h2>
<p id="rGst" style="text-align:center;font-size:11px;font-weight:bold"></p>
<p id="rPhone" style="text-align:center;font-size:11px;font-weight:bold;margin-bottom:4px"></p>
<p style="text-align:center;font-weight:bold">CUSTOMER BILL</p>
<p>Token: <span id="rToken"></span></p><hr>

<script>
const firebaseConfig={
apiKey:"AIzaSyDM06RpXjspQnYx5uD_JKwnkQDvffJMRy4",
databaseURL:"https://rj-billing-app-default-rtdb.firebaseio.com/",
projectId:"rj-billing-app",
storageBucket:"rj-billing-app.firebasestorage.app"
};

let db=null;
let auth=null;

try{
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
db=firebase.database();
auth=firebase.auth();
}catch(e){
console.error(e);
}

/* LOGIN SETTINGS */
const ADMIN_PHONE="8881544782";
const ADMIN_EMAIL=ADMIN_PHONE+"@rjpos.app";

async function loginAdmin(){
const phone=document.getElementById('loginPhone').value.trim();
const password=document.getElementById('loginPassword').value;
const button=document.getElementById('loginButton');
const message=document.getElementById('loginMessage');

if(phone!==ADMIN_PHONE){
message.textContent="गलत मोबाइल नंबर";
return;
}
if(!password){
message.textContent="पासवर्ड डालें";
return;
}
if(!auth){
message.textContent="Firebase Authentication शुरू नहीं हुआ";
return;
}

button.disabled=true;
button.textContent="LOGIN हो रहा है...";
message.textContent="";

try{
await auth.signInWithEmailAndPassword(ADMIN_EMAIL,password);
message.textContent="";
}catch(e){
console.error(e);
message.textContent="Login नहीं हुआ: "+e.message;
}finally{
button.disabled=false;
button.textContent="LOGIN";
}
}

function logoutAdmin(){
if(confirm("क्या आप Logout करना चाहते हैं?")){
auth.signOut();
}
}

/* LOGIN CHECK */
if(auth){
auth.onAuthStateChanged(user=>{
const allowed=!!(user&&user.email&&user.email.toLowerCase()===ADMIN_EMAIL.toLowerCase());

document.getElementById('loginScreen').classList.toggle('hidden',allowed);
document.getElementById('appShell').classList.toggle('hidden',!allowed);

if(!allowed){
document.getElementById('loginPassword').value="";
if(user)auth.signOut();
}
});
}

/* APP DATA */
let shop = localStorage.getItem('rj_shop_name') || 'Mister Shawarma';
if(shop === 'RJ Restaurant') {
    shop = 'Mister Shawarma';
    localStorage.setItem('rj_shop_name', shop);
}

let shopPhone=localStorage.getItem('rj_shop_phone')||'';
let token=+(localStorage.getItem('rj_token_no')||1);
let pay='Cash',cart=[],category='all',ordersCache={};

let gstEnabled=localStorage.getItem('rj_gst_enabled')==='true';
let gstRate=Number(localStorage.getItem('rj_gst_rate')||5);
let gstNumber=localStorage.getItem('rj_gst_number')||'';

const defaultItems=[
// SHAWARMAS
['CLASSIC CHICKEN SHAWARMA',60,'Shawarmas'],
['PIRI PIRI CHICKEN SHAWARMA',70,'Shawarmas'],
['ACHARI CHICKEN SHAWARMA',70,'Shawarmas'],
['FIERY CHICKEN SHAWARMA',70,'Shawarmas'],
['CHILLI MILLI CHICKEN SHAWARMA',70,'Shawarmas'],
['BBQ CHICKEN SHAWARMA',80,'Shawarmas'],
['CHICKEN TIKKA SHAWARMA',90,'Shawarmas'],
['FIRANGI CHICKEN SHAWARMA',90,'Shawarmas'],
['HUMMUS CHICKEN SHAWARMA',100,'Shawarmas'],

// SALADS
['CLASSIC CHICKEN SALAD',160,'Salads'],
['FIRANGI CHICKEN SALAD',180,'Salads'],
['PIRI PIRI CHICKEN SALAD',170,'Salads'],
['ACHARI CHICKEN SALAD',170,'Salads'],
['FIERY CHICKEN SALAD',170,'Salads'],
['CHICKEN TIKKA SALAD',180,'Salads'],
['BBQ CHICKEN SALAD',170,'Salads'],
['CHILLI MILLI CHICKEN SALAD',170,'Salads'],
['HUMMUS CHICKEN SALAD',180,'Salads'],

// OPEN SHAWARMAS
['CLASSIC CHICKEN SHAWARMA',135,'Open Shawarmas'],
['PIRI PIRI CHICKEN SHAWARMA',135,'Open Shawarmas'],
['ACHARI CHICKEN SHAWARMA',135,'Open Shawarmas'],
['FIERY CHICKEN SHAWARMA',135,'Open Shawarmas'],
['CHILLI MILLI CHICKEN SHAWARMA',135,'Open Shawarmas'],
['BBQ CHICKEN SHAWARMA',135,'Open Shawarmas'],
['CHICKEN TIKKA SHAWARMA',135,'Open Shawarmas'],
['FIRANGI CHICKEN SHAWARMA',135,'Open Shawarmas'],
['HUMMUS CHICKEN SHAWARMA',135,'Open Shawarmas']
];

let menu=JSON.parse(localStorage.getItem('rj_menu_items')||'null')||
defaultItems.map(x=>({name:x[0],price:x[1],tag:x[2]}));

const money=n=>'₹'+Math.round(Number(n)||0);

function msg(t,err=false){
let s=document.getElementById('status');
s.textContent=t;
s.className='text-center mt-2 font-bold text-xs '+(err?'text-red-400':'text-emerald-400');
}

function drawer(){
document.getElementById('drawerBox').classList.toggle('hidden');
}

function go(v){
['pos','dashboard','reports','tables'].forEach(x=>
document.getElementById(x).classList.add('hidden'));
document.getElementById(v).classList.remove('hidden');
if(v==='pos')tab('new');
if(v==='dashboard'||v==='reports')stats();
}

function tab(t){
document.getElementById('newPanel').classList.toggle('hidden',t!=='new');
document.getElementById('billingPanel').classList.toggle('hidden',t!=='billing');
document.getElementById('newTab').className=t==='new'?'bg-red-600 p-2 rounded shadow font-bold text-xs':'p-2 text-gray-300 font-bold text-xs';
document.getElementById('billTab').className=t==='billing'?'bg-red-600 p-2 rounded shadow font-bold text-xs':'p-2 text-gray-300 font-bold text-xs';
if(t==='billing')historyLoad();
}

function esc(s){
return String(s).replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
}

function renderMenu(){
let q=document.getElementById('search').value.toLowerCase();
let arr=menu.filter(x=>x.name.toLowerCase().includes(q)&&(category==='all'||x.tag===category));

document.getElementById('menuList').innerHTML=arr.map(x=>
`<div class="flex justify-between items-center bg-gray-800 p-2.5 rounded border border-gray-700">
<div><b class="text-white text-xs">${esc(x.name)}</b><span class="text-[10px] bg-gray-700 px-1.5 py-0.5 ml-2 rounded text-gray-300 font-bold">${esc(x.tag)}</span><p class="text-amber-400 font-black text-xs mt-0.5">${money(x.price)}</p></div>
<button class="bg-emerald-600 hover:bg-emerald-500 px-3 py-2 rounded text-white font-black text-xs shadow" onclick="addItem(${JSON.stringify(x.name).replace(/"/g,'&quot;')},${Number(x.price)})">ADD</button>
</div>`).join('')||'<p class="text-gray-400 font-bold text-xs p-2">No items found</p>';
}

function addItem(n,p){
let x=cart.find(i=>i.name===n);
x?x.qty++:cart.push({name:n,price:+p,qty:1});
drawCart();
}

function qty(i,d){
cart[i].qty+=d;
if(cart[i].qty<1)cart.splice(i,1);
drawCart();
}

function drawCart(){
document.getElementById('token').textContent='#'+token;

document.getElementById('cart').innerHTML=cart.length?cart.map((x,i)=>
`<div class="flex justify-between items-center bg-gray-800 p-2 rounded border border-gray-700 text-xs font-bold">
<span class="truncate flex-1 text-white">${esc(x.name)}</span>
<button onclick="qty(${i},-1)" class="px-2 py-0.5 bg-gray-700 rounded text-red-300 font-black text-sm">×</button>
<b class="px-2 text-white">${x.qty}</b>
<button onclick="qty(${i},1)" class="px-2 py-0.5 bg-gray-700 rounded text-green-300 font-black text-sm">+</button>
<span class="text-amber-300 ml-1">${money(x.price*x.qty)}</span>
<button onclick="cart.splice(${i},1);drawCart()" class="text-red-400 font-black text-sm ml-2 px-1">🗑️</button>
</div>`).join(''):
'<p class="text-center text-gray-400 font-bold py-4 text-xs">No items added yet.</p>';

totals();
}

function totals(){
let sub=cart.reduce((s,x)=>s+x.price*x.qty,0);
let dp=Math.min(100,Math.max(0,+document.getElementById('discount').value||0));
let disc=sub*dp/100;
let taxable=sub-disc;
let tax=gstEnabled?Math.round(taxable*gstRate/100):0;
let grand=Math.round(taxable+tax);

document.getElementById('subtotal').textContent=money(sub);
document.getElementById('tax').textContent=money(tax);
document.getElementById('taxLabel').textContent=gstEnabled?`GST ${gstRate}%`:'GST OFF';
document.getElementById('grand').textContent=money(grand);

return{sub,dp,disc,tax,grand};
}

function payStyle(){
['Cash','Card','Due'].forEach(x=>
document.getElementById(x.toLowerCase()).className=
(pay===x?'bg-emerald-600 text-white font-black shadow':'bg-gray-800 border border-gray-700 text-gray-300 font-bold')+' p-2.5 rounded text-xs');
}

/* GST BUTTON */
function updateGSTButton(){
let b=document.getElementById('gstButton');
b.textContent=gstEnabled?'GST ON':'GST OFF';
b.className=(gstEnabled?'bg-emerald-600':'bg-red-600')+' px-2.5 py-1.5 rounded font-bold text-xs shadow';
}

function toggleGST(){
gstEnabled=!gstEnabled;
localStorage.setItem('rj_gst_enabled',gstEnabled);
document.getElementById('gstEnabled').checked=gstEnabled;
updateGSTButton();
totals();
msg(gstEnabled?'GST चालू हो गया':'GST बंद हो गया');
}

/* SAVE BILL */
async function saveBill(){
if(!cart.length){
msg('ऑर्डर खाली है! पहले item जोड़ें।',true);
return;
}
if(!db){
msg('Firebase initialize नहीं हुआ।',true);
return;
}
if(!auth||!auth.currentUser){
msg('पहले Login करें।',true);
return;
}

const b=document.getElementById('saveBtn');
b.disabled=true;
b.textContent='Saving…';

const t=totals();

const data={
token,
items:cart.map(x=>({...x})),
subtotal:t.sub,
discountPercent:t.dp,
discountAmount:Math.round(t.disc),
tax:t.tax,
gstEnabled,
gstRate:gstEnabled?gstRate:0,
gstNumber:gstEnabled?gstNumber:'',
total:t.grand,
paymentMode:pay,
note:document.getElementById('note').value||'',
shopName:shop,
shopPhone:shopPhone,
timestamp:Date.now()
};

try{
const ref=await db.ref('orders').push(data);
if(!ref.key)throw new Error('Firebase ने बिल ID नहीं दी');

msg('बिल सेव हो गया ✓');
cart=[];
document.getElementById('note').value='';
document.getElementById('discount').value=0;
token++;
localStorage.setItem('rj_token_no',token);
drawCart();

}catch(e){
console.error('SAVE ERROR:',e);
msg('SAVE नहीं हुआ: '+(e.message||e.code||e),true);
alert('Bill Save Error:\n'+(e.message||e.code||e));
}finally{
b.disabled=false;
b.textContent='SAVE';
}
}

function receiptData(order){
let t=totals();
let items=order?order.items:cart;
let sub=order?order.subtotal:t.sub;
let dp=order?order.discountPercent:t.dp;
let disc=order?order.discountAmount:Math.round(t.disc);
let tax=order?order.tax:t.tax;
let grand=order?order.total:t.grand;
let enabled=order?!!order.gstEnabled:gstEnabled;
let rate=order?Number(order.gstRate||0):gstRate;
let num=order?order.gstNumber:gstNumber;
let phone=order?order.shopPhone:shopPhone;

document.getElementById('rShop').textContent=order?.shopName||shop;
document.getElementById('rGst').textContent=num?("GSTIN: "+num):"";
document.getElementById('rPhone').textContent=phone?("Phone: "+phone):"";
document.getElementById('rToken').textContent='#'+(order?.token||token);

document.getElementById('rItems').innerHTML=items.map(i=>
`<div style="display:flex;justify-content:space-between;margin:4px 0;font-weight:bold">
<span>${esc(i.name)} ×${i.qty}</span>
<span>${money(i.price*i.qty)}</span>
</div>`).join('');

document.getElementById('rTotals').innerHTML=
`<p style="font-weight:bold">Subtotal: ${money(sub)}</p>
${dp?`<p style="font-weight:bold">Discount (${dp}%): -${money(disc)}</p>`:''}
${enabled?`<p style="font-weight:bold">GST ${rate}%: ${money(tax)}</p>`:'<p style="font-weight:bold">GST: OFF</p>'}
<h3 style="font-size:15px;font-weight:bold">Total: ${money(grand)}</h3>
<p style="font-weight:bold">Payment: ${order?.paymentMode||pay}</p>`;
}

function printBill(){
if(!cart.length){
msg('ऑर्डर खाली है!',true);
return;
}
receiptData();
printEl('receipt');
}

function printEl(id){
let el=document.getElementById(id);
el.classList.add('printing');
window.addEventListener('afterprint',()=>el.classList.remove('printing'),{once:true});
window.print();
setTimeout(()=>el.classList.remove('printing'),1500);
}

function printKot(){
if(!cart.length){
msg('ऑर्डर खाली है!',true);
return;
}

document.getElementById('kToken').textContent='#'+token;
document.getElementById('kTime').textContent=new Date().toLocaleString();

document.getElementById('kItems').innerHTML=cart.map(x=>
`<p style="display:flex;justify-content:space-between;font-weight:bold">
<span>${esc(x.name)}</span><span>Qty ${x.qty}</span></p>`).join('');

document.getElementById('kNote').textContent=document.getElementById('note').value;
printEl('kot');
}

/* BILL HISTORY */
async function historyLoad(){
let h=document.getElementById('history');
h.innerHTML='Loading…';

try{
let snap=await db.ref('orders').once('value');
ordersCache=snap.val()||{};
let a=Object.entries(ordersCache).reverse();

h.innerHTML=a.map(([k,o])=>
`<div class="bg-gray-900 p-3 rounded border border-gray-800 flex justify-between gap-2 font-bold text-xs">
<div>
<b class="text-amber-400 text-sm">Token #${o.token}</b> <span class="text-white ml-1">${money(o.total)}</span>
<p class="text-gray-200 mt-1">${(o.items||[]).map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</p>
<small class="text-gray-400 mt-0.5 block">${new Date(o.timestamp).toLocaleString()} | ${o.paymentMode}</small>
</div>
<button class="bg-blue-600 hover:bg-blue-500 px-3 py-2 rounded text-white font-black shadow h-fit" onclick="duplicate('${k}')">Duplicate Print</button>
</div>`).join('')||'<p class="text-gray-400 text-xs">No saved bills</p>';

}catch(e){
h.textContent='Firebase Error: '+e.message;
}
}

function duplicate(k){
let o=ordersCache[k];
if(!o)return;
receiptData(o);
printEl('receipt');
}

/* DASHBOARD AND REPORTS */
async function stats(){
try{
let s=await db.ref('orders').once('value');
let a=Object.values(s.val()||{});
let today=new Date().toDateString();
let tod=a.filter(o=>new Date(o.timestamp).toDateString()===today);
let sum=tod.reduce((n,o)=>n+(+o.total||0),0);

document.getElementById('dash').textContent=
`Today sales: ${money(sum)} | Orders: ${tod.length}`;

document.getElementById('report').textContent=
`Today's Sale: ${money(sum)} | Total Sale: ${money(a.reduce((n,o)=>n+(+o.total||0),0))} | Total Orders: ${a.length}`;

}catch(e){
document.getElementById('report').textContent='Firebase: '+e.message;
}
}

/* SETTINGS */
function settingsOpen(){
document.getElementById('shopName').value=shop;
document.getElementById('shopPhone').value=shopPhone;
document.getElementById('gstEnabled').checked=gstEnabled;
document.getElementById('gstRate').value=gstRate;
document.getElementById('gstNumber').value=gstNumber;
document.getElementById('settings').classList.remove('hidden');
}

function settingsTaxPreview(){
gstEnabled=document.getElementById('gstEnabled').checked;
gstRate=Math.min(100,Math.max(0,Number(document.getElementById('gstRate').value)||0));
updateGSTButton();
totals();
}

function settingsClose(){
document.getElementById('settings').classList.add('hidden');
}

function settingsSave(){
shop=document.getElementById('shopName').value.trim()||'Mister Shawarma';
shopPhone=document.getElementById('shopPhone').value.trim();
gstEnabled=document.getElementById('gstEnabled').checked;
gstRate=Math.min(100,Math.max(0,Number(document.getElementById('gstRate').value)||0));
gstNumber=document.getElementById('gstNumber').value.trim().toUpperCase();

localStorage.setItem('rj_shop_name',shop);
localStorage.setItem('rj_shop_phone',shopPhone);
localStorage.setItem('rj_gst_enabled',gstEnabled);
localStorage.setItem('rj_gst_rate',gstRate);
localStorage.setItem('rj_gst_number',gstNumber);

document.getElementById('shopHead').textContent=shop;
updateGSTButton();
settingsClose();
totals();
msg('Settings सेव हो गई ✓');
}

/* EDIT MENU */
function menuOpen(){
document.getElementById('menuModal').classList.remove('hidden');
editMenuRender();
}

function menuClose(){
document.getElementById('menuModal').classList.add('hidden');
renderMenu();
}

function menuAdd(){
let n=document.getElementById('newName').value.trim();
let p=+document.getElementById('newPrice').value||0;
let tg=document.getElementById('newTag').value;

if(!n)return alert('Item name लिखें');

menu.push({name:n,price:p,tag:tg});
menuSave();

document.getElementById('newName').value='';
document.getElementById('newPrice').value='';
editMenuRender();
}

function menuSave(){
localStorage.setItem('rj_menu_items',JSON.stringify(menu));
}

function editMenuRender(){
document.getElementById('editMenu').innerHTML=menu.map((x,i)=>
`<div class="flex gap-1.5 items-center">
<input class="bg-gray-800 p-2 rounded flex-1 text-xs text-white font-bold outline-none border border-gray-700" value="${esc(x.name)}"
onchange="menu[${i}].name=this.value;menuSave()">
<input class="bg-gray-800 p-2 rounded w-16 text-xs text-white font-bold outline-none border border-gray-700 text-right" type="number" value="${x.price}"
onchange="menu[${i}].price=+this.value;menuSave()">
<select class="bg-gray-800 p-2 rounded text-xs text-white font-bold outline-none border border-gray-700" onchange="menu[${i}].tag=this.value;menuSave()">
<option value="Shawarmas" ${x.tag==='Shawarmas'?'selected':''}>Shawarmas</option>
<option value="Salads" ${x.tag==='Salads'?'selected':''}>Salads</option>
<option value="Open Shawarmas" ${x.tag==='Open Shawarmas'?'selected':''}>Open Shawarmas</option>
</select>
<button onclick="menu.splice(${i},1);menuSave();editMenuRender()" class="text-red-400 px-2 font-black text-sm">✕</button>
</div>`).join('');
}

/* APP START */
document.getElementById('shopHead').textContent=shop;
updateGSTButton();
renderMenu();
drawCart();
payStyle();
</script>
